name: AI Trend Radar

on:
  # Every Monday at 08:00 UTC
  schedule:
    - cron: "0 8 * * 1"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Trend Radar
        env:
          # Required: Resend API key for sending the report email.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Sender must be a Resend-verified domain address,
          # or "onboarding@resend.dev" for testing.
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          # Where the report is delivered.
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Optional: raises the GitHub search API rate limit.
          # The built-in token is provided automatically by Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Upload report PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-trend-radar-report
          path: output/ai_trend_radar.pdf
          if-no-files-found: ignore
